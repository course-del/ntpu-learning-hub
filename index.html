      const fileInputRef = useRef(null);

      // 安全跳轉控制
      const handlePageNavigation = (pageKeyOrCustomUrl, defaultTitle = "專區") => {
        if (!pageKeyOrCustomUrl) return;

        if (siteConfig.pages[pageKeyOrCustomUrl]) {
          const page = siteConfig.pages[pageKeyOrCustomUrl];
          if (page.enabled && page.url && page.url.trim() !== "") {
            window.location.href = page.url;
          } else {
            setModalInfo({
              isOpen: true,
              title: `「${page.title}」專區籌備中`,
              message: page.statusText || "該子頁面正在整備第一期資料與服務，完成後將於第一時間公告開放，感謝你的支持！"
            });
          }
          return;
        }

        if (typeof pageKeyOrCustomUrl === "string" && pageKeyOrCustomUrl.startsWith("http")) {
